name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_VERSION: 4.5.1
    steps:
      - uses: actions/checkout@v4
      - uses: romaine-life/pipeline-templates/actions/check-fetches@main
      - name: Download the pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          asset="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          release="https://artifacts.home.romaine.life/general/github/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL "$release/$asset" -o "$RUNNER_TEMP/$asset"
          curl -fsSL "$release/SHA512-SUMS.txt" -o "$RUNNER_TEMP/SHA512-SUMS.txt"
          (cd "$RUNNER_TEMP"; awk -v asset="$asset" '$2 == asset { print }' SHA512-SUMS.txt | sha512sum --check -)
          unzip -q "$RUNNER_TEMP/$asset" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import and check every GDScript
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --path . --import
          while IFS= read -r -d '' script; do
            "$GODOT" --headless --path . --check-only --script "$script"
          done < <(git ls-files -z '*.gd')
      - name: Start the main scene without a display
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --path . --quit-after 2 > "$RUNNER_TEMP/godot-scene.log" 2>&1
          cat "$RUNNER_TEMP/godot-scene.log"
          ! grep -Eq '(^|[[:space:]])(SCRIPT ERROR|ERROR):' "$RUNNER_TEMP/godot-scene.log"
